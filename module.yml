title: "Tidyverse"
repo: Tidyverse
image:
  file: media/module_image.jpg
  alt: "A pepsis wasp, also known as the tarantula hawk."
epigraph: >-
  The ability to quickly and easily manipulate and rework data is the
  base foundation for all the work you will be doing in `R`.  There is
  no more fundamental (and important) skill required than being able to
  quickly and easily take raw data and reconfigure it properly for
  inclusion into an analysis, summary, graphic, or table.  Using
  features of the `tidyverse` library are key.
resources:
  - "The data set we will use for this is the Rice Rivers Center data set (from 2014). You can download it as a [CSV](https://dyerlabteaching.github.io/CourseData/Environmental/RiceRivers_2014.csv) file."
  - "A [cheat sheet](https://github.com/rstudio/cheatsheets/raw/main/data-transformation.pdf) going over the basic analysis verb functions from `dplyr`."
